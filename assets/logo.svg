<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="tokenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="92" height="92" x="4" y="4" rx="22" fill="#0f172a" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2.5" />
  <!-- 外圈进度弧线 -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="5" />
  <circle cx="50" cy="50" r="32" fill="none" stroke="url(#tokenGrad)" stroke-width="5" stroke-dasharray="160 200" stroke-linecap="round" transform="rotate(-90 50 50)" />
  <!-- 中心发光闪电 -->
  <polygon points="52,24 34,50 48,50 46,74 66,44 52,44" fill="url(#tokenGrad)" filter="url(#glow)" />
</svg>
